name: Deploy Backend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Create deployment package
        run: |
          tar -czf moving-backend-release.tar.gz \
            src \
            dist \
            node_modules \
            prisma \
            package.json \
            package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: moving-backend-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload deployment package
        id: artifact
        env:
          DEPLOY_BUCKET: ${{ secrets.DEPLOY_BUCKET }}
        run: |
          set -Eeuo pipefail

          ARTIFACT_KEY="deployments/backend/${GITHUB_SHA}.tar.gz"

          aws s3 cp \
            moving-backend-release.tar.gz \
            "s3://${DEPLOY_BUCKET}/${ARTIFACT_KEY}"

          ARTIFACT_URL=$(aws s3 presign \
            "s3://${DEPLOY_BUCKET}/${ARTIFACT_KEY}" \
            --expires-in 900)

          echo "artifact_key=$ARTIFACT_KEY" >> "$GITHUB_OUTPUT"
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"

      - name: Create SSM command payload
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact_url }}
        run: |
          jq -n \
            --arg command "sudo -iu ubuntu bash -lc 'cd /home/ubuntu/moving-backend && git fetch origin main && git reset --hard origin/main && bash scripts/deploy.sh \"${ARTIFACT_URL}\"'" \
            '{commands: [$command]}' \
            > ssm-commands.json

          echo "===== SSM command payload created ====="

      - name: Send deployment command
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy moving-backend from GitHub Actions" \
            --parameters file://ssm-commands.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          WAIT_EXIT_CODE=$?

          set -e

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "===== Deployment output ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          echo "===== Deployment errors ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          echo "Final SSM status: $STATUS"

          if [ "$WAIT_EXIT_CODE" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed."
            exit 1
          fi

          echo "✅ GitHub Actions deployment succeeded."

      - name: Remove deployment package
        if: always()
        env:
          DEPLOY_BUCKET: ${{ secrets.DEPLOY_BUCKET }}
          ARTIFACT_KEY: ${{ steps.artifact.outputs.artifact_key }}
        run: |
          if [ -n "${ARTIFACT_KEY:-}" ]; then
            aws s3 rm "s3://${DEPLOY_BUCKET}/${ARTIFACT_KEY}" || true
          fi
