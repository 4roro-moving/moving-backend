name: Deploy Backend

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 with SSM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: moving-backend-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create SSM command payload
        run: |
          jq -n \
            --arg command "sudo -iu ubuntu bash -lc 'cd /home/ubuntu/moving-backend && git fetch origin dev && git reset --hard origin/dev && bash scripts/deploy.sh'" \
            '{commands: [$command]}' \
            > ssm-commands.json

          echo "===== SSM command payload ====="
          cat ssm-commands.json

      - name: Send deployment command
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy moving-backend from GitHub Actions" \
            --parameters file://ssm-commands.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          WAIT_EXIT_CODE=$?

          set -e

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "===== Deployment output ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          echo "===== Deployment errors ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true

          echo "Final SSM status: $STATUS"

          if [ "$WAIT_EXIT_CODE" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed."
            exit 1
          fi

          echo "✅ GitHub Actions deployment succeeded."
