name: Deploy Backend

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 with SSM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: moving-backend-deploy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create SSM command payload
        env:
          DEPLOY_SCRIPT: |
            set -Eeuo pipefail

            cd /home/ubuntu/moving-backend

            echo "📥 Fetch latest code..."
            git fetch origin dev
            git reset --hard origin/dev

            echo "📦 Install dependencies..."
            npm ci

            echo "🛠 Generate Prisma Client..."
            npx prisma generate

            echo "🏗 Build application..."
            npm run build

            echo "🗄 Apply database migrations..."
            npx prisma migrate deploy

            echo "🚀 Restart application..."
            pm2 restart moving-backend --update-env
            pm2 save

            echo "🩺 Check application health..."
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent http://localhost/api/health; then
                echo
                echo "✅ Deployment completed successfully."
                exit 0
              fi

              echo "Health check attempt ${attempt} failed."
              sleep 5
            done

            echo "❌ Health check failed."
            pm2 logs moving-backend --lines 50 --nostream
            exit 1
        run: |
          jq -n \
            --arg command "sudo -iu ubuntu bash -lc $(printf '%q' "$DEPLOY_SCRIPT")" \
            '{commands: [$command]}' \
            > ssm-commands.json

      - name: Send deployment command
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy moving-backend from GitHub Actions" \
            --parameters file://ssm-commands.json \
            --timeout-seconds 900 \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for deployment
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set +e

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          WAIT_EXIT_CODE=$?
          set -e

          echo "===== Deployment output ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text

          echo "===== Deployment errors ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "Final SSM status: $STATUS"

          if [ "$WAIT_EXIT_CODE" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            exit 1
          fi
